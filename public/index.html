<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controlled Operations Agent</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            background: #f4f6f8;
            color: #17212b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(720px, 100%);
            height: min(760px, calc(100vh - 48px));
            display: grid;
            grid-template-rows: auto 1fr auto;
            background: white;
            border: 1px solid #dce2e8;
            border-radius: 14px;
            box-shadow: 0 12px 34px rgb(23 33 43 / 10%);
            overflow: hidden;
        }

        h1 {
            margin: 0;
            padding: 20px 22px;
            font-size: 1.25rem;
            border-bottom: 1px solid #e7ebef;
        }

        #messages {
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 82%;
            padding: 11px 14px;
            border-radius: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .user {
            align-self: flex-end;
            background: #1769e0;
            color: white;
        }

        .assistant {
            align-self: flex-start;
            background: #eef2f5;
        }

        .trace {
            margin-top: -8px;
            color: #6b7785;
            font-size: 0.78rem;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e7ebef;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid #cbd3dc;
            border-radius: 9px;
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 0 18px;
            background: #1769e0;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled { opacity: 0.55; cursor: wait; }
    </style>
</head>
<body>
    <main>
        <h1>Controlled Operations Agent</h1>
        <section id="messages" aria-live="polite"></section>
        <form id="chat-form">
            <input id="message" aria-label="Message" autocomplete="off" placeholder="Ask about an order…" required>
            <button type="submit">Send</button>
        </form>
    </main>

    <script>
        const sessionKey = "controlled-operations-session-id";
        let sessionId = localStorage.getItem(sessionKey);

        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem(sessionKey, sessionId);
        }

        const form = document.querySelector("#chat-form");
        const input = document.querySelector("#message");
        const messages = document.querySelector("#messages");
        const button = form.querySelector("button");

        function addMessage(text, role) {
            const item = document.createElement("div");
            item.className = `message ${role}`;
            item.textContent = text;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        function addTrace(tools) {
            if (!tools || tools.length === 0) return;

            const trace = document.createElement("div");
            trace.className = "trace";
            trace.textContent = `Tools: ${tools.join(" → ")}`;
            messages.appendChild(trace);
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            button.disabled = true;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId, message })
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Chat request failed");
                }

                addMessage(result.reply, "assistant");
                addTrace(result.tool_trace);
            } catch (error) {
                addMessage(`Error: ${error.message}`, "assistant");
            } finally {
                button.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
